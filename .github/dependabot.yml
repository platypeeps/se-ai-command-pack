version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Every pip bump needs a `make lock` follow-up commit before it can go
    # green, so one PR per package multiplies that manual step by the number of
    # pins. Batching patch and minor bumps into a single weekly PR makes it one
    # regeneration per week. Majors stay ungrouped: sd-update-deps always routes
    # them to manual review, and a major sharing a PR would hold the safe bumps
    # hostage to it.
    groups:
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
