name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded PR runs, but never a push-to-main run: that lane drives the
# release tag and must not be interrupted by a following push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: "python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock"
      - name: Run tests under coverage with floor
        run: |
          python -m coverage erase
          COVERAGE_PROCESS_START="$GITHUB_WORKSPACE/.coveragerc" \
          PYTHONPATH="$GITHUB_WORKSPACE/tests/_coverage_subprocess${PYTHONPATH:+:$PYTHONPATH}" \
            python -m coverage run -m unittest discover -s tests
          python -m coverage combine
          python -m coverage report --fail-under=80

  test-hermetic:
    # The suite against a tracked-files-only copy under a hostile git
    # configuration. `make check` deliberately omits it; this lane is where the
    # property is enforced. A fetch depth of 0 is not needed — the lane builds
    # its own throwaway repository from the checked-out working tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: "python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock"
      - name: Run the suite hermetically
        run: make test-hermetic

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # Stdlib-only, so it runs before the install: a desynced lock should fail
      # with its own findings rather than as an opaque pip hash error.
      - run: python .github/scripts/check-dev-requirements-lock.py
      - run: "python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock"
      - run: python -m ruff check install.py installer tests .github/scripts templates/skills/se-review-skills/scripts/skill_review.py
      - run: python -m mypy installer install.py templates/skills/se-review-skills/scripts/skill_review.py
      - name: Shell syntax check for vendored scripts
        run: make shell-syntax

  release-payload-gate:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: "python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock"
      - run: python .github/scripts/generate-skill-surfaces.py --check
      - run: python .github/scripts/check-trellis-provenance.py
      - name: Resolve payload gate base
        id: gate-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            # Push to main: gate the payload accumulated since the last release
            # tag. A tagless repo (first release) degrades to HEAD, which the
            # gate reads as no diff and passes; that first payload was already
            # gated on its own pull request.
            echo "base=$(git describe --tags --abbrev=0 2>/dev/null || echo HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - run: python .github/scripts/check-release-payload.py --base "$BASE_REF"
        env:
          # On push the base is a ref (last release tag or HEAD), not a SHA.
          BASE_REF: ${{ steps.gate-base.outputs.base }}

  review-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run vendored review preflight
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "${EVENT_BASE_SHA}^{commit}" >/dev/null; then
            echo "error: event base ${EVENT_BASE_SHA:-<empty>} does not resolve; failing closed." >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && ! git merge-base --is-ancestor "$EVENT_BASE_SHA" "$AFTER_SHA"; then
            echo "error: push base is not an ancestor of the head (force push?); failing closed." >&2
            exit 1
          fi
          SD_AI_COMMAND_PACK_REVIEW_PREFLIGHT_BASE_REF="$EVENT_BASE_SHA" \
            node ~/.agents/bin/sd-ai-command-pack-review-preflight.mjs

  ci-result:
    needs: [unittest, test-hermetic, lint, release-payload-gate, auto-tag-release, review-preflight]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Aggregate lane results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/aggregate-ci-result.py

  auto-tag-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unittest, lint, release-payload-gate]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/create-release-tag.py --push
