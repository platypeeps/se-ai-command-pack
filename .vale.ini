# Vale prose gate — enforcing: `make prose-lint` runs inside `make check`
# and as its own CI lane, which installs Vale pinned by version and SHA-256.
#
# Scope is opt-in: only files matching a glob section below are linted.
# Everything else — .claude/, .opencode/, .gemini/, .codex/, .trellis/,
# generated surfaces, vendored trees — is excluded by not being matched.
# CHANGELOG.md is deliberately not matched: it is historical release text;
# rewriting it to satisfy a linter would falsify the record.
#
# Developed against Vale 3.18 (pin the same major in CI; design D4).
StylesPath = .vale/styles
MinAlertLevel = suggestion

# Root-level docs. New root docs must be added here to be linted.
[{README,CONTRIBUTING,AGENTS}.md]
BasedOnStyles = se

# The pack's prose product: skill documents.
[templates/skills/**/*.md]
BasedOnStyles = se
